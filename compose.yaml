services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: planejo
      POSTGRES_PASSWORD: planejo
      POSTGRES_DB: planejo
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planejo -d planejo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
